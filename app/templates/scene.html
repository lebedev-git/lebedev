<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Проекты — {{ owner.name }}</title>
<link rel="stylesheet" href="/static/css/scene.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<nav id="hud">
  <div id="crumbs"></div>
  <div id="zones">
    <button id="btn-overview">Комната</button>
    <button id="btn-projects">Проекты</button>
  </div>
</nav>

<aside id="panel" aria-live="polite"></aside>

<!--
  Источник данных для сцены и одновременно дубль для поисковиков.
  Без JS остаётся обычным читаемым списком; сцена прячет его при старте.
-->
<main id="projects-data">
  <h1>Проекты — {{ owner.name }}</h1>
  {% for p in projects %}
  <article
    data-slug="{{ p.slug }}"
    data-title="{{ p.title }}"
    data-summary="{{ p.summary }}"
    data-tags="{{ p.tags }}"
    data-role="{{ p.role }}"
    data-year="{{ p.year }}"
    data-link="{{ p.link }}"
    data-featured="{{ p.featured }}">
    <h2><a href="/projects/{{ p.slug }}">{{ p.title }}</a></h2>
    <p>{{ p.summary }}</p>
    <div class="p-body">{{ p.description }}</div>
  </article>
  {% endfor %}
</main>

<script type="module" src="/static/js/scene/main.js"></script>
</body>
</html>
