<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}{{ owner.name }} — {{ owner.role }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ owner.name }} — AI Automation Engineer и руководитель проектов. Превращаю идеи и рутину в работающие системы на базе ИИ.{% endblock %}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="brand"><span>Андрей Лебедев</span></a>
      <button class="burger" aria-label="Меню">☰</button>
      <div class="nav-links">
        <a href="/projects" class="{{ 'active' if active=='projects' }}">Проекты</a>
        <a href="/about" class="{{ 'active' if active=='about' }}">Обо мне</a>
        <a href="/experience" class="{{ 'active' if active=='experience' }}">Опыт</a>
        <a href="/blog" class="{{ 'active' if active=='blog' }}">Блог</a>
        <a href="{{ owner.telegram_url }}" target="_blank" rel="noopener">Связаться</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© 2026 {{ owner.name }}</span>
      <span>
        <a href="{{ owner.telegram_url }}" target="_blank" rel="noopener">Telegram</a> ·
        <a href="tel:{{ owner.phone_href }}">{{ owner.phone }}</a>
      </span>
    </div>
  </footer>

  <script src="/static/js/main.js"></script>
</body>
</html>
