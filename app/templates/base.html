<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}{{ owner.name }} — {{ owner.role }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ owner.name }} — AI Automation Engineer. Превращаю рутину и сложные данные в автономные системы без участия человека.{% endblock %}" />
<meta name="theme-color" content="#07090E" />

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<!-- OpenGraph / Telegram Preview -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ owner.name }}" />
<meta property="og:title" content="{% block og_title %}{{ owner.name }} — AI Automation & Digital Systems{% endblock %}" />
<meta property="og:description" content="{% block og_description %}Проектирую и запускаю автономные AI-системы, интеграции на n8n и платформы под ключ. Команда резидента ИТ-парка.{% endblock %}" />
<meta property="og:url" content="{{ site_url }}{{ request.url.path }}" />
<link rel="canonical" href="{{ site_url }}{{ request.url.path }}" />
<meta property="og:image" content="{{ site_url }}{% block og_image %}/static/og-image.png{% endblock %}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{% block twitter_title %}{{ owner.name }} — AI Automation & Digital Systems{% endblock %}" />
<meta name="twitter:description" content="{% block twitter_description %}Проектирую и запускаю автономные AI-системы, интеграции на n8n и платформы под ключ.{% endblock %}" />
<meta name="twitter:image" content="{{ site_url }}{% block twitter_image %}/static/og-image.png{% endblock %}" />

<!-- Класс ставится до отрисовки: иначе анимируемые блоки успевают моргнуть
     конечным состоянием, прежде чем скрипт их спрячет. -->
<script>document.documentElement.classList.replace("no-js", "js")</script>
<link rel="stylesheet" href="/static/css/fonts.css?v={{ asset_v }}" />
<link rel="stylesheet" href="/static/css/core.css?v={{ asset_v }}" />
<link rel="stylesheet" href="/static/css/site.css?v={{ asset_v }}" />
</head>
<body>
<div class="bg-blueprint-grid" aria-hidden="true"></div>
<div id="toast-notify" class="toast-popup" aria-live="polite"></div>

<nav class="top">
  <div class="wrap nav-inner">
    <a href="/" class="brand"><span class="brand-name">{{ owner.name }}</span></a>
    <button type="button" class="menu-btn" aria-expanded="false" aria-controls="nav-links">Меню</button>
    <div class="links" id="nav-links">
      <a href="/#skills">Навыки</a>
      <a href="/#projects">Проекты</a>
      <a href="/#contact">Контакты</a>
      <a href="{{ owner.telegram_url }}" class="hire" target="_blank" rel="noopener">Написать в Telegram ↗</a>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <span>© 2026 {{ owner.name }} · {{ owner.city }}</span>
      <span>
        <a href="{{ owner.telegram_url }}" target="_blank" rel="noopener">Telegram</a> ·
        <a href="tel:{{ owner.phone_href }}">{{ owner.phone }}</a>
      </span>
    </div>
  </div>
</footer>

{% if metrika_id %}
<!-- Яндекс Метрика: номер счётчика живёт в .env (METRIKA_ID), в коде его нет -->
<script>
   (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
   m[i].l=1*new Date();
   for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
   (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
   ym({{ metrika_id }}, "init", {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", accurateTrackBounce:true, trackLinks:true});
</script>
<noscript><div><img src="https://mc.yandex.ru/watch/{{ metrika_id }}" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
{% endif %}

<script type="module" src="/static/js/motion.js?v={{ asset_v }}"></script>
<script type="module" src="/static/js/filter.js?v={{ asset_v }}"></script>
</body>
</html>
